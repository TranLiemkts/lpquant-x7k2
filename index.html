<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
.top,.info,.chips,.status,.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line)}
.top{background:#10141b}.brand{font-weight:800;color:var(--acc);font-size:15px}.ver{background:#1b5e20;color:#b9f6ca;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700}

.btn{background:#1c2330;border:1px solid #344055;color:var(--tx);padding:4px 9px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600}
.btn:hover{border-color:var(--acc)}.btn.on{background:var(--acc);color:#111;border-color:var(--acc)}
.btn.gc.on{background:#ff4d4f;border-color:#ff4d4f;color:#fff}.btn.gld.on{background:#7c4dff;border-color:#7c4dff;color:#fff}
.btn.gex.on{background:#1565c0;border-color:#1e88e5;color:#fff}.btn.poc.on{background:#5c6bc0;border-color:#7986cb;color:#fff}
.btn.sm{padding:2px 6px;font-size:10.5px}.info span{cursor:help}
.chip{border:1px solid;border-radius:4px;padding:3px 8px;cursor:pointer;font-weight:600;font-size:11px;background:#151a23}.chip.off{opacity:.35}
.warn{padding:5px 12px;background:#2a1f0a;color:#ffcc80;border-bottom:1px solid #4a3510;font-size:11px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px;padding:8px}
@media(max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}}
html,body{max-width:100%;overflow-x:hidden;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}#c1,#c2,#ov{touch-action:none}.grid>div,.card{min-width:0}.tw{overflow:auto;-webkit-overflow-scrolling:touch}

.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-weight:700;color:#ffcc80;font-size:11px;text-transform:uppercase}
.tfs{display:flex;gap:3px;flex-wrap:wrap}.tfs .btn{padding:2px 7px}
#c1w{position:relative;height:560px}#c1{position:absolute;inset:0;z-index:0}#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#cv{position:absolute;left:0;top:0}#c2{height:170px;border-top:1px solid var(--line)}
.lbl{position:absolute;left:6px;pointer-events:auto;cursor:help;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;border:1px solid;background:rgba(21,26,35,.92);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.5)}
#cdb{position:absolute;pointer-events:auto;cursor:help;background:#ffb300;color:#111;font-weight:800;font-size:11px;padding:1px 5px;border-radius:3px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:3px 6px;text-align:right;white-space:nowrap}
th{color:var(--mu);font-weight:600;position:sticky;top:0;background:var(--panel);font-size:10.5px;cursor:help;border-bottom:1px dotted #3a4252}

.tw{max-height:300px;overflow:auto}.tag{display:inline-block;padding:0 4px;border-radius:3px;font-size:9.5px;font-weight:800;color:#111;margin-left:4px}
.pos{color:var(--up)}.neg{color:var(--dn)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px}.kv div:nth-child(odd){color:var(--mu)}
.foot{padding:6px 12px;color:var(--mu);font-size:10.5px;border-top:1px solid var(--line)}
.toolbar{border-top:1px solid var(--line);border-bottom:0;background:#10141b}

function cinfo(i) { const b = bars[i]; return {up: b.high - Math.max(b.open, b.close), lo: Math.min(b.open, b.close) - b.low,

function evaluate() {

  const n = bars.length, last = n > 1 ? cinfo(n - 2) : null, pos = spot >= fl;

    ${sec('3. Tình huống & hành động', act, l.color)}
    <div class="mu" style="margin-top:6px">Kiểm tra: ${isGld ? `mở OptionCharts/Barchart GLD, hạn ${M.gld_exp}, strike ${l.strike}` : `mở QuikStrike ${M.contract}, rê chuột vào cột ${l.strike}`} → ${side} OI phải = ${f0(l.oi)}. Nguồn: ${isGld ? 'yfinance (OPRA)' : M.cme_src + ' ' + M.cme_date}.</div>`;

function tipRow(pool, i) {
  const r = (pool === 'cme' ? D.cme_rows : D.gld_rows)[i], g = pool === 'gld';
  const conv = g ? `Giá XAU = ${r.k} × ${M.gld_mult} = <code>${f2(r.xau)}</code>` : `Giá XAU = ${r.k} − ${f2(M.basis)} = <code>${f2(r.xau)}</code>`;
  return `<h4>${g ? 'Bể GLD' : 'Bể GC'} – Strike ${r.k} → ${f2(r.xau)} ${r.tag ? '(' + r.tag + ')' : ''}</h4>
    • ${conv} &nbsp;|&nbsp; Khoảng cách tới Spot: <code>${sgn(r.xau - spot)}$</code><br>
    • Call OI ${f0(r.oic)} · Put OI ${f0(r.oip)} → Tổng ${f0(r.tot)}<br>
    • %OI = Tổng OI ÷ Tổng OI lớn nhất bảng × 100 = ${f0(r.tot)} ÷ ${f0(g ? M.gld_max_tot : M.cme_max_tot)} × 100 = <code>${r.str}%</code><br>
    ${!g ? `• ΔOI (Call + Put) = ${r.doi == null ? 'chưa có chuỗi phiên trước' : '<code>' + sgn(r.doi, f0) + '</code> so với ' + M.prev_date}<br>` : ''}
    ${sec('GEX', gexCalc(r.gamma, r.d1, g ? M.gld : M.fut, g ? r.iv : M.atm_iv, g ? M.t_gld_days : Math.max(M.dte, 0.5), r.oic, r.oip, r.gex, g ? ' (GLD)' : ' (GC)'))}
    ${!g ? `• DEX = Σ Δ × OI × 100 × S ÷ 10⁶ = <code>${sgn(r.dex)} triệu $</code> (Δcall = N(d1), Δput = N(d1) − 1)` : ''}`;
}
const TH = {

  gdoi: 'ΔOI = Tổng OI hôm nay − Tổng OI bản chụp ngày trước (code tự lưu mỗi ngày, cùng kỳ đáo hạn). "—" = chưa có bản chụp hôm trước.',
  str: '%OI = Tổng OI strike ÷ Tổng OI lớn nhất bảng × 100.'};

    case 'live': return `Trạng thái kết nối giá live. Trình duyệt của bạn gọi trực tiếp Binance (api.binance.com / data-api.binance.vision) và Swissquote; Colab ở Mỹ bị Binance chặn nên phần live chạy ở trình duyệt.`;
    case 'calib': return `<h4>Khớp sàn: ${sgn(adj)}$</h4>Cộng/trừ thêm vào giá để khớp đúng giá MT5 của sàn bạn đang giao dịch (mỗi sàn lệch vài chục cent). Bấm số ở giữa để về 0. Giá trị được nhớ trong trình duyệt.`;
    case 'fut': return `Giá hợp đồng vàng tương lai GC=F (yfinance, trễ ~10 phút) lúc chạy code.`;
    case 'basis': return `<h4>Basis = ${f2(M.basis)}</h4>${M.basis_mode === 'auto' ? `Tự động = GC=F ${f2(M.gc_last)} − Spot ${f2(M.spot)}` : `Nhập tay MANUAL_BASIS = ${f2(M.manual_basis)} (đổi BASIS_MODE = "auto" để tính GC=F − Spot)`}.<br>Mọi strike CME → giá XAU = Strike − Basis.`;
    case 'gld': return `Giá cổ phiếu GLD (đóng cửa gần nhất, yfinance) = ${f2(M.gld)}.`;
    case 'mult': return `<h4>Hệ số GLD = ${M.gld_mult}</h4>= Spot lúc chạy code ÷ Giá GLD = ${f2(M.spot)} ÷ ${f2(M.gld)} = <code>${M.gld_mult}</code><br>(GLD thu phí 0.40%/năm nên 1 cổ phiếu ≈ 1/${M.gld_mult} oz, không còn đúng 1/10 oz).<br>Mọi strike GLD → giá XAU = Strike × ${M.gld_mult}.`;
    case 'cme': return `<h4>Nguồn chuỗi CME: ${M.cme_src}</h4>Ngày dữ liệu: ${M.cme_date}${M.prev_date ? ' · so ΔOI với ' + M.prev_date : ''}.<br>Thứ tự ưu tiên: JSON Settlements (CME_SETTLE_URL) → CSV QuikStrike → bản lưu gần nhất → số nhập tay. OI của CME chỉ cập nhật 1 lần/ngày (~12h–13h giờ VN).`;
    case 'flip': return tipLevel(lv('FLIP'));
    case 'netgex': return `<h4>Net GEX tại Spot: ${sgn(D.gex.at_spot)}M$/1%</h4>Tổng GEX của Bể GC (${sgn(D.gex.cme)}M$) + Bể GLD (${sgn(D.gex.gld)}M$) tính tại giá hiện hành lúc build.<br>Dương → dealer kìm biến động · Âm → dealer khuếch đại biến động.`;

    case 'sig': return `<h4>Logic tín hiệu</h4>• Vào vùng khi Spot cách tường ≤ ${CFG.zone}$.<br>• SELL xác nhận: nến vừa đóng có râu trên ≥ thân và ≥ 40% biên độ, delta < 0.<br>• BUY xác nhận: râu dưới ≥ thân và ≥ 40% biên độ, delta > 0.<br>• SL = tường ± ${CFG.sl}$ · TP = mốc kế tiếp theo hướng lệnh (cách entry > ${CFG.sl}$).`;
    case 'btn:tv': return `<h4>Copy dữ liệu cho indicator TradingView</h4>Bấm để copy 1 dòng chứa toàn bộ mốc tường hôm nay (CME ${M.contract} ngày ${M.cme_date}).<br>
      Trên TradingView: mở cài đặt indicator <b>LP Quant – CME/GLD Walls</b> (biểu tượng ⚙) → dán vào ô <b>Chuỗi dữ liệu LP Quant</b> → OK.<br>
      <span class="mu">Làm 1 lần mỗi ngày sau khi dashboard cập nhật. Giá và khoảng cách trên TradingView tự chạy live.</span>`;
    case 'btn:edit': return 'Sửa nhanh 4 Strike CME (Call Wall, Trap 1, Trap 2, Put Wall) và Basis. Giá XAU = Strike − Basis. Chỉ đổi trên trang này, không lưu.';
    case 'btn:gc': return 'Ẩn/hiện các vạch Bể GC (CME): Call Wall, Trap 1, Trap 2, Put Wall.';
    case 'btn:gld': return 'Ẩn/hiện các vạch và bảng Bể GLD.';
    case 'btn:gex': return 'Ẩn/hiện cột GEX ngang ở mép phải chart (xanh = GEX dương, đỏ = âm, tím = GLD; dài = lớn).';
    case 'btn:poc': return prof ? `<h4>POC / Value Area (${prof.n} nến ${tf})</h4>• Chia giá thành các ô ${f2(prof.step)}$, rải volume mỗi nến đều từ Low đến High.<br>• POC = ô volume lớn nhất = <code>${f2(prof.poc)}</code><br>• VA = mở rộng từ POC tới khi đủ 70% tổng volume: VAH <code>${f2(prof.vah)}</code> · VAL <code>${f2(prof.val)}</code>` : 'POC/VA';
    case 'opt:tips': return 'Bật/tắt bảng giải thích khi rê chuột.';
    case 'opt:lbl': return 'Đổi kiểu nhãn trên chart: ĐẦY ĐỦ → GỌN → TẮT. Nhãn chạy theo đường kẻ; tường ngoài khung nhìn thì kéo/zoom chart để thấy.';
    case 'opt:bs': return 'Bật/tắt ký hiệu B/S trên nến đã từ chối tại tường (râu dài + delta đúng hướng, trong vùng ±' + CFG.zone + '$).';
    case 'opt:box': return 'Bật/tắt hộp Entry / SL / TP vẽ ở nến hiện tại khi có tín hiệu.';
  }
  return null;
}
const tip = $('tip'); let tipKey = null, mx = 0, my = 0;
const TOUCH = window.matchMedia && matchMedia('(hover: none)').matches;   // iPhone / máy tính bảng
function placeTip() { const r = tip.getBoundingClientRect(); let x = mx + 14, y = my + 14;
  if (x + r.width > innerWidth - 8) x = mx - r.width - 14; if (y + r.height > innerHeight - 8) y = Math.max(8, innerHeight - r.height - 8);
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = y + 'px'; }
function showTip(k) { if (!opt.tips || !k) { hideTip(); return; } const h = tipFor(k); if (!h) { hideTip(); return; }
  tipKey = k; tip.innerHTML = h; tip.style.display = 'block'; placeTip(); }
function hideTip() { tipKey = null; tip.style.display = 'none'; }
document.addEventListener('mousemove', e => { if (TOUCH) return; mx = e.clientX; my = e.clientY; const el = e.target.closest && e.target.closest('[data-tip]');

ch1.subscribeCrosshairMove(p => {      // rê chuột vào đường kẻ trên chart
  if (!p.point) { if (tipKey && tipKey.startsWith('line:')) hideTip(); return; }
  const hit = levels.filter(visible).map(l => ({l, d: Math.abs(cs.priceToCoordinate(l.xau) - p.point.y)})).filter(o => o.d <= 5).sort((a, b) => a.d - b.d)[0];
  if (hit) { const k = 'lvl:' + hit.l.key; if (!opt.tips) return; tipKey = 'line:' + hit.l.key; tip.innerHTML = tipFor(k); tip.style.display = 'block'; placeTip(); }
  else if (tipKey && tipKey.startsWith('line:')) hideTip(); });
