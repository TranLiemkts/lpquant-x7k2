<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LP Quant"><meta name="theme-color" content="#0d1016">
<title>LP Quant v12.3</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0d1016;--panel:#141922;--line:#252c38;--tx:#d6dbe3;--mu:#7d8796;--up:#26a69a;--dn:#ef5350;--acc:#ffb300}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
.top,.info,.chips,.status,.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line)}
.top{background:#10141b}.brand{font-weight:800;color:var(--acc);font-size:15px}.ver{background:#1b5e20;color:#b9f6ca;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:700}
.px{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}.chg{font-weight:700}.mu{color:var(--mu)}.sp{flex:1}
.cd{border:1px solid var(--acc);color:var(--acc);border-radius:4px;padding:2px 8px;font-weight:700;font-variant-numeric:tabular-nums}
.btn{background:#1c2330;border:1px solid #344055;color:var(--tx);padding:4px 9px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600}
.btn:hover{border-color:var(--acc)}.btn.on{background:var(--acc);color:#111;border-color:var(--acc)}
.btn.gc.on{background:#ff4d4f;border-color:#ff4d4f;color:#fff}.btn.gld.on{background:#7c4dff;border-color:#7c4dff;color:#fff}
.btn.gex.on{background:#1565c0;border-color:#1e88e5;color:#fff}.btn.poc.on{background:#5c6bc0;border-color:#7986cb;color:#fff}
.btn.sm{padding:2px 6px;font-size:10.5px}.info span{cursor:help}
.chip{border:1px solid;border-radius:4px;padding:3px 8px;cursor:pointer;font-weight:600;font-size:11px;background:#151a23}.chip.off{opacity:.35}
.warn{padding:5px 12px;background:#2a1f0a;color:#ffcc80;border-bottom:1px solid #4a3510;font-size:11px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:8px;padding:8px}
@media(max-width:1100px){.grid{grid-template-columns:minmax(0,1fr)}}
.tabs{display:inline-flex;gap:3px;margin-left:6px}.tab{background:#1c2330;border:1px solid #344055;color:#aab3c0;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:10.5px;font-weight:700;text-transform:none}
.tab.on{background:#ffb300;color:#111;border-color:#ffb300}.rcol>.panel{margin-top:8px}.rcol>.panel:first-child{margin-top:0}
@media(min-width:1100px){
  html,body{height:100%;overflow:hidden}body{display:flex;flex-direction:column}
  .top,.info{padding:4px 10px}.warn{padding:3px 12px}
  .grid{flex:1;min-height:0;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);padding:6px;gap:6px}
  .lcol{display:flex;flex-direction:column;min-height:0}.lcol>.card{flex:1;display:flex;flex-direction:column;min-height:0}
  #c1w{flex:1;height:auto!important;min-height:220px}#c2{height:130px!important;flex:none}#chartCard .foot{padding:2px 10px;font-size:10px}
  .rcol{display:grid;grid-template-rows:minmax(0,30fr) minmax(0,33fr) minmax(0,37fr);grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;min-height:0}
  #pStrike{grid-column:1/3}.rcol>.panel{margin-top:0;display:flex;flex-direction:column;min-height:0}
  .pbody{flex:1;overflow:auto;min-height:0}.pbody .tw{max-height:none;overflow:visible}
  .toolbar{padding:3px 10px}.toolbar .btn,.toolbar select{padding:2px 7px;font-size:10.5px}
}
select.btn{appearance:auto}
.pop{position:fixed;z-index:60;background:#0f141c;border:1px solid #ffb300;border-radius:6px;padding:8px 12px;display:none;font-size:11.5px;box-shadow:0 6px 24px rgba(0,0,0,.6);max-height:80vh;overflow:auto}
.pop label{display:block;padding:2px 0;cursor:pointer;white-space:nowrap}.pop .h{color:#ffcc80;font-weight:700;margin:6px 0 2px;font-size:10.5px;text-transform:uppercase}.pop input{vertical-align:middle;margin-right:5px}
html,body{max-width:100%;overflow-x:hidden;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}#c1,#c2,#ov{touch-action:none}.grid>div,.card{min-width:0}.tw{overflow:auto;-webkit-overflow-scrolling:touch}
@media(max-width:760px){.ch{flex-wrap:wrap}.ch .tfs{width:100%}.top,.info{gap:6px;padding:6px 8px}.grid{padding:4px;gap:6px}.px{font-size:19px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-weight:700;color:#ffcc80;font-size:11px;text-transform:uppercase}
.tfs{display:flex;gap:3px;flex-wrap:wrap}.tfs .btn{padding:2px 7px}
#c1w{position:relative;height:560px}#c1{position:absolute;inset:0;z-index:0}#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
#cv{position:absolute;left:0;top:0}#c2{height:170px;border-top:1px solid var(--line)}
.lbl{position:absolute;left:6px;pointer-events:auto;cursor:help;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;border:1px solid;background:rgba(21,26,35,.92);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.5)}
#cdb{position:absolute;pointer-events:auto;cursor:help;background:#ffb300;color:#111;font-weight:800;font-size:11px;padding:1px 5px;border-radius:3px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:3px 6px;text-align:right;white-space:nowrap}
th{color:var(--mu);font-weight:600;position:sticky;top:0;background:var(--panel);font-size:10.5px;cursor:help;border-bottom:1px dotted #3a4252}
tr:nth-child(even) td{background:#121720}tr.near td{background:#3a2f12!important}tbody tr{cursor:help}tbody tr:hover td{background:#1e2635}
.tw{max-height:300px;overflow:auto}.tag{display:inline-block;padding:0 4px;border-radius:3px;font-size:9.5px;font-weight:800;color:#111;margin-left:4px}
.pos{color:var(--up)}.neg{color:var(--dn)}
.sig{padding:10px}.sigbox{border:2px solid #444;border-radius:6px;padding:8px;text-align:center;font-size:15px;font-weight:800;margin-bottom:8px;cursor:help}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px}.kv div:nth-child(odd){color:var(--mu)}
.foot{padding:6px 12px;color:var(--mu);font-size:10.5px;border-top:1px solid var(--line)}
.toolbar{border-top:1px solid var(--line);border-bottom:0;background:#10141b}
#tip{position:fixed;z-index:99;max-width:min(520px,calc(100vw - 16px));background:#0b0e13;border:1px solid #ffb300;border-radius:6px;padding:10px 12px;font-size:12px;line-height:1.5;display:none;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.6)}
#tip h4{margin:0 0 6px;font-size:13px}#tip .sec{border-left:3px solid #3b4558;padding:4px 8px;margin-top:6px;background:#121722}
#tip code{color:#ffd180;font-family:inherit;font-weight:700}#tip .f{color:#80d8ff}
</style></head><body>
<div class="top">
  <span class="brand">LP QUANT</span><span class="ver">v12.5 AUTO-CME</span>
  <span class="mu" data-tip="spot">XAU Spot</span><span class="px" id="px" data-tip="spot">—</span><span class="chg" id="chg" data-tip="chg"></span>
  <span class="cd" id="cd" data-tip="countdown">⏱ —</span>
  <span id="live" class="mu" data-tip="live">● đang kết nối giá live…</span>
  <span class="mu" data-tip="calib">Khớp sàn:</span>
  <button class="btn sm" data-adj="-1" data-tip="calib">-1$</button><button class="btn sm" data-adj="-0.2" data-tip="calib">-0.2$</button>
  <button class="btn sm" data-adj="0.2" data-tip="calib">+0.2$</button><button class="btn sm" data-adj="1" data-tip="calib">+1$</button>
  <button class="btn sm" data-adj="0" data-tip="calib" id="adjv">0.00</button>
  <span class="sp"></span>
  <span class="mu" data-tip="set">Kỳ CME:</span>
  <button class="btn sm" data-set="near" data-tip="set:near">Gần</button><button class="btn sm" data-set="month" data-tip="set:month">Tháng</button><button class="btn sm" data-set="all" data-tip="set:all">Tổng hợp</button>
  <button class="btn" id="bTv" data-tip="btn:tv" style="border-color:#2962ff">📋 Copy cho TradingView</button>
  <button class="btn" id="bEdit" data-tip="btn:edit">⚙️ Sửa Strike CME</button>
  <button class="btn gc on" id="bGc" data-tip="btn:gc">● Bể GC</button>
  <button class="btn gld on" id="bGld" data-tip="btn:gld">● Bể GLD</button>
  <button class="btn gex on" id="bGex" data-tip="btn:gex">▥ Cột GEX</button>
  <button class="btn poc" id="bPoc" data-tip="btn:poc">▤ POC/VA</button>
</div>
<div class="info mu" id="info"></div>
<div id="warns"></div><div id="alertbar" class="warn" style="display:none;background:#3a1010;color:#ffcdd2;border-color:#6a1b1b;font-weight:700"></div>
<div class="grid">
  <div class="lcol"><div class="card" id="chartCard">
    <div class="ch">Chart XAUUSD + vạch tường <span class="sp"></span><div class="tfs" id="tfs"></div></div>
    <div id="c1w"><div id="c1"></div><div id="ov"><canvas id="cv"></canvas><div id="cdb" data-tip="countdown"></div></div></div>
    <div class="ch" style="border-top:1px solid var(--line)" data-tip="cvd">Delta (cột) &amp; CVD (đường) <span class="sp"></span><span class="mu" id="cvdtxt" style="text-transform:none"></span></div>
    <div id="c2"></div>
    <div class="foot" id="srcline"></div>
  </div></div>
  <div class="rcol">
    <div class="card panel" id="pStrike"><div class="ch">Strike Profile
        <span class="tabs"><button class="tab on" data-tab="strike:gc" data-tip="cme">Bể GC (CME)</button><button class="tab" data-tab="strike:gld" data-tip="mult">Bể GLD</button></span>
        <span class="sp"></span><span class="mu" id="cmesrc" style="text-transform:none" data-tip="cme"></span><span class="mu" id="gldsrc" style="text-transform:none;display:none" data-tip="mult"></span></div>
      <div class="pbody">
        <div class="pane" data-pane="strike:gc"><div class="mu" id="cmestats" style="padding:5px 10px;font-size:11px;border-bottom:1px solid var(--line)" data-tip="stats"></div>
          <div class="tw"><table id="tCme"></table></div></div>
        <div class="pane" data-pane="strike:gld" style="display:none" id="gldCard"><div class="tw"><table id="tGld"></table></div></div>
      </div></div>
    <div class="card panel" id="pSig"><div class="ch">Tín hiệu tường<span class="sp"></span><span id="regime" style="text-transform:none" data-tip="flip"></span></div>
      <div class="pbody"><div class="sig"><div class="sigbox" id="sigbox" data-tip="sig">—</div><div class="kv" id="sigkv"></div></div></div></div>
    <div class="card panel" id="pMisc"><div class="ch">
        <span class="tabs"><button class="tab on" data-tab="misc:news" data-tip="news">Tin đỏ</button><button class="tab" data-tab="misc:ai" data-tip="ai">AI</button><button class="tab" data-tab="misc:bt" data-tip="bt">Backtest</button><button class="tab" data-tab="misc:j" data-tip="journal">Nhật ký</button></span>
        <span class="sp"></span><span class="mu" id="miscmeta" style="text-transform:none"></span></div>
      <div class="pbody">
        <div class="pane" data-pane="misc:news"><div class="mu" id="newsnext" style="padding:4px 10px"></div><div class="sig" id="news" style="padding:6px 10px"></div></div>
        <div class="pane" data-pane="misc:ai" style="display:none" id="aiCard"><div class="mu" id="aimeta" style="padding:4px 10px"></div><div class="sig" id="ai" style="white-space:pre-wrap;font-size:12px"></div></div>
        <div class="pane" data-pane="misc:bt" style="display:none"><div class="mu" id="btnote" style="padding:4px 10px;font-size:11px"></div><div class="tw"><table id="tBt"></table></div>
          <div class="mu" style="padding:4px 10px;font-size:11px" id="btlist"></div></div>
        <div class="pane" data-pane="misc:j" style="display:none"><div style="padding:4px 10px"><button class="btn sm" id="jAdd">＋ Ghi lệnh</button> <button class="btn sm" id="jCsv">⬇ CSV</button></div>
          <div class="tw"><table id="tJ"></table></div></div>
      </div></div>
    <div class="card panel" id="pCtx"><div class="ch">Bối cảnh thị trường</div>
      <div class="pbody"><div class="sig"><div class="kv" id="ctxkv"></div></div></div></div>
    <div class="card panel" id="pAgent"><div class="ch">
        <span class="tabs"><button class="tab on" data-tab="agent:a" data-tip="agent">LP Quant Agent</button><button class="tab" data-tab="agent:smc" data-tip="smc">SMC</button></span>
        <span class="sp"></span><span id="agentAct" style="text-transform:none"></span></div>
      <div class="pbody">
        <div class="pane" data-pane="agent:a"><div class="sig" id="agent"></div></div>
        <div class="pane" data-pane="agent:smc" style="display:none"><div class="sig" id="smcbox"></div></div>
      </div></div>
  </div>
</div>
<div class="toolbar">
  <button class="btn on" id="oTips" data-tip="opt:tips">💡 Giải thích khi rê chuột: BẬT</button>
  <button class="btn on" id="oLbl" data-tip="opt:lbl">🏷 Nhãn chart: ĐẦY ĐỦ</button>
  <button class="btn on" id="oBs" data-tip="opt:bs">🎯 Ký hiệu B/S tại nến: BẬT</button>
  <select class="btn" id="oBoxN" data-tip="opt:box"><option value="-1">📐 Hộp SL/TP: Tắt</option><option value="0">📐 Chỉ lệnh hiện tại</option>
    <option value="1">📐 + 1 lệnh gần nhất</option><option value="3">📐 + 3 lệnh</option><option value="5">📐 + 5 lệnh</option><option value="10">📐 + 10 lệnh</option><option value="20">📐 + 20 lệnh</option><option value="999">📐 + Tất cả lệnh</option></select>
  <button class="btn" id="oCompact" data-tip="opt:compact">🧹 Chế độ gọn: TẮT</button>
  <button class="btn on" id="oZone" data-tip="opt:zone">🎯 Vùng hội tụ: BẬT</button>
  <button class="btn" id="oAlert" data-tip="opt:alert">🔔 Cảnh báo: TẮT</button>
  <button class="btn" id="oSmcS" data-tip="opt:smcs">📈 SMC cấu trúc ▾</button>
  <button class="btn" id="oSmcG" data-tip="opt:smcg">⚡ SMC tín hiệu ▾</button>
  <select class="btn" id="oSrc" data-tip="opt:src"><option value="wall">🧪 Lệnh hộp/backtest: Tường CME</option><option value="smc">🧪 Lệnh: Tín hiệu SMC</option><option value="both">🧪 Lệnh: Tường + SMC</option></select>
  <span class="sp"></span><span class="mu" id="foot"></span>
</div>
<div class="pop" id="popS">
  <label title="Bật/tắt toàn bộ phần vẽ cấu trúc SMC"><input type="checkbox" data-smc="st"><b>Hiện cấu trúc SMC</b></label>
  <div class="h">Cấu trúc chính</div>
  <label title="Đường BoS (phá cấu trúc cùng xu hướng) và CHoCH (đổi tính chất – đảo chiều)"><input type="checkbox" data-smc="bc">BoS / CHoCH</label>
  <label title="Nhãn đỉnh/đáy cấu trúc: HH, LH sell, LL, LL buy"><input type="checkbox" data-smc="hl">Nhãn HH / LH / LL</label>
  <label title="Zigzag nối các đỉnh/đáy cấu trúc chính"><input type="checkbox" data-smc="mzz">Zigzag cấu trúc chính</label>
  <label title="Chấm tại đáy/đỉnh mạnh (điểm bắt đầu nhịp tạo BoS/CHoCH)"><input type="checkbox" data-smc="dot">Chấm đỉnh/đáy mạnh</label>
  <label title="Inducement: đáy/đỉnh pullback phải bị quét thì sóng hồi mới hợp lệ"><input type="checkbox" data-smc="idm">IDM (đã quét)</label>
  <label title="IDM hiện tại theo xu hướng: ✅ đã quét / ⏳ chưa quét"><input type="checkbox" data-smc="lidm">IDM live</label>
  <label title="Râu vượt đỉnh/đáy cấu trúc nhưng nến đóng lại bên trong"><input type="checkbox" data-smc="swm">Quét thanh khoản chính (x)</label>
  <div class="h">Internal</div>
  <label title="Zigzag internal (theo nến không nằm trong nến trước)"><input type="checkbox" data-smc="izz">Zigzag internal</label>
  <label title="Chấm đỉnh/đáy internal"><input type="checkbox" data-smc="idot">Chấm đỉnh/đáy internal</label>
  <label title="Râu quét đỉnh/đáy internal rồi đóng lại bên trong"><input type="checkbox" data-smc="swi">Quét internal (x)</label>
  <label title="Hộp Orderflow tạo khi có tín hiệu Pro/Flip (khung hiện tại + khung lớn H1/H4)"><input type="checkbox" data-smc="of">Vùng Orderflow</label>
</div>
<div class="pop" id="popG">
  <label title="Bật/tắt toàn bộ tín hiệu SMC (mũi tên + đường kích hoạt)"><input type="checkbox" data-smc="sg"><b>Hiện tín hiệu SMC</b></label>
  <div class="h">Loại tín hiệu</div>
  <label title="Tiếp diễn thuận xu hướng internal: sóng hồi phải quét IDM ($) rồi nến đóng phá đáy/đỉnh internal"><input type="checkbox" data-smc="pro">Buy / Sell — Pro tiếp diễn</label>
  <label title="Sau khi quét đỉnh/đáy CẤU TRÚC CHÍNH, nến đóng phá đáy/đỉnh internal gần nhất"><input type="checkbox" data-smc="m">Buy M / Sell M — sweep cấu trúc chính</label>
  <label title="Sau khi quét đỉnh/đáy INTERNAL, nến đóng phá đáy/đỉnh internal đối diện"><input type="checkbox" data-smc="sw">Buy sw / Sell sw — sweep internal</label>
  <label title="Vào sớm: nến pinbar tại điểm quét (râu ≥ 35% nến) hoặc quét 2 lần"><input type="checkbox" data-smc="star">★ Sweep sớm (pinbar & quét kép)</label>
  <label title="Hộp Orderflow bị nến đóng phá ngược → đảo hướng (Flip); bị phá lần nữa → Trap"><input type="checkbox" data-smc="flip">🔄 Flip / ⚡ Trap</label>
  <label title="Nến nhồi lệnh trong vùng Orderflow cùng hướng"><input type="checkbox" data-smc="scob">💎 SCOB nhồi lệnh</label>
  <div class="h">Bộ lọc (giống bản Pine)</div>
  <label title="Chỉ báo Buy/Sell thuận Orderflow khung lớn (H1 khi xem khung &lt; 1h, H4 khi xem 1h–4h)"><input type="checkbox" data-smc="fHtf">[1] Thuận Orderflow khung lớn</label>
  <label title="Pro chỉ báo khi điểm quét chạm Orderflow cũ hoặc nằm ở nửa giá tốt (> 50%) của cấu trúc"><input type="checkbox" data-smc="fZone">[2] Chạm Orderflow / vùng &gt; 50%</label>
  <label title="Pro bỏ qua nhịp sóng nhỏ hơn 0.8 × ATR(14) (lọc sideway)"><input type="checkbox" data-smc="fAtr">[3] Lọc sideway (≥ 0.8 ATR)</label>
</div>

// ================= VÙNG HỘI TỤ (Confluence) — gom mốc của MỌI kỳ + GLD + Volume Profile =================
const CONF_W = 6;   // các mốc cách nhau ≤ 6$ được coi là cùng một vùng
function calcZones() {
  const items = [];
  // bỏ kỳ 'Tổng hợp' (đã chứa các kỳ khác) để tránh đếm trùng nguồn
  Object.values(D.sets).filter(S => S.key !== 'all').forEach(S => S.levels.forEach(l => { if (['CW', 'PW', 'T1', 'T2', 'MAG', 'MP'].includes(l.key)) items.push({x: l.xau, src: `${S.label} ${l.name}`, grp: S.key + l.key}); }));
  D.gld_levels.forEach(l => items.push({x: l.xau, src: `GLD ${l.name}`, grp: 'GLD' + l.key}));
  const fl = lv('FLIP'); if (fl) items.push({x: fl.xau, src: 'Gamma Flip', grp: 'FLIP'});
  if (prof) [['POC', prof.poc], ['VAH', prof.vah], ['VAL', prof.val]].forEach(([n, x]) => items.push({x, src: n, grp: n}));
  items.sort((a, b) => a.x - b.x);
  const out = []; let cur = null;
  items.forEach(it => { if (cur && it.x - cur.hi <= CONF_W) { cur.items.push(it); cur.hi = it.x; } else { cur = {lo: it.x, hi: it.x, items: [it]}; out.push(cur); } });
  out.forEach(z => { const g = {}; z.items.forEach(i => g[i.grp] = i.src); z.srcs = [...new Set(Object.values(g))]; z.score = z.srcs.length; z.mid = (z.lo + z.hi) / 2; });
  ZONES = out.filter(z => z.score >= 2);
}

// ================= BACKTEST tín hiệu trên nến đang xem (giống Simulator RFX) =================
function simTrade(dir, i, sl, meta) {   // vào giá đóng nến i, TP = 1.5R, tối đa 36 nến; SL chạm trước được tính trước
  const e = bars[i].close, risk = Math.abs(e - sl); if (risk < 0.05 || (dir > 0 ? sl >= e : sl <= e)) return null;
  const tp = e + dir * 1.5 * risk; let res = 'T', r = 0, xi = i, xp = e;
  const jEnd = Math.min(bars.length, i + 37);
  for (let j = i + 1; j < jEnd; j++) { const x = bars[j]; xi = j;
    const hitSL = dir < 0 ? x.high >= sl : x.low <= sl, hitTP = dir < 0 ? x.low <= tp : x.high >= tp;
    if (hitSL) { res = 'L'; r = -1; xp = sl; break; } if (hitTP) { res = 'W'; r = 1.5; xp = tp; break; }
    r = dir * (x.close - e) / risk; xp = x.close; }
  if (res === 'T' && jEnd === bars.length && jEnd - i < 37) res = 'O';        // lệnh còn đang chạy (chưa đủ 36 nến)
  return Object.assign({dir, res, r, t: bars[i].time, i, xi, e, sl, tp, xp}, meta);
}
function backtest() {

      walls.forEach(l => { let dir = 0;
        if (RES.includes(l.key) && Math.abs(b.high - l.xau) <= CFG.zone && rejSell(c)) dir = -1;
        if (SUP.includes(l.key) && Math.abs(b.low - l.xau) <= CFG.zone && rejBuy(c)) dir = 1;
        if (!dir || used[i + '' + dir]) return; used[i + '' + dir] = 1;
        const t = simTrade(dir, i, dir < 0 ? Math.max(b.high, l.xau) + CFG.sl : Math.min(b.low, l.xau) - CFG.sl, {kind: 'wall', wall: l.name, wx: l.xau}); if (t) R.push(t); }); }); }
  if (src !== 'wall' && SMC && SMCO.sg) SMC.sig.filter(x => smcOn(x.kind)).forEach(x => { const t = simTrade(x.dir, x.i, x.sl, {kind: x.kind, wall: 'SMC ' + x.txt}); if (t) R.push(t); });
  R.sort((a, b) => a.i - b.i); BT = R;
  const row = (name, f) => { const a = R.filter(x => x.res !== 'O').filter(f), w = a.filter(x => x.res === 'W').length, l = a.filter(x => x.res === 'L').length, t = a.length - w - l, tot = a.reduce((s, x) => s + x.r, 0);

  const rows = [];

  const lab = {W: '<span class="pos">TP</span>', L: '<span class="neg">SL</span>', T: 'Hết giờ', O: '<span style="color:#ffb300">Đang chạy</span>'};

const sec = (t, b, c) => `<div class="sec" ${c ? `style="border-left-color:${c}"` : ''}><b>${t}</b><br>${b}</div>`;
function partsCalc(parts, gex, unit) {
  if (!parts || !parts.length) return '—';
  const one = p => gexCalc(p.gamma, p.d1, p.S, p.iv, p.T, p.oic, p.oip, p.gex, unit);
  if (parts.length === 1) return `<span class="mu">Kỳ ${parts[0].c}</span><br>` + one(parts[0]);
  return parts.map(p => `<b>Kỳ ${p.c}</b><br>${one(p)}`).join('<br>') + `<br>• <b>GEX tổng hợp</b> = ${parts.map(p => '(' + sgn(p.gex) + ')').join(' + ')} = <code>${sgn(gex)} triệu $</code>`;
}
function gexCalc(g, d1, S, iv, Td, oic, oip, gex, unit) {
  return `• d1 = [ln(S/K) + σ²T/2] ÷ (σ√T) = <code>${f4(d1)}</code> &nbsp;(S = ${f2(S)}${unit}, σ = ${(iv * 100).toFixed(1)}%, T = ${Td} ngày ÷ 365)<br>
    • Γ = φ(d1) ÷ (S·σ·√T) = <code>${g == null ? '—' : g.toExponential(4)}</code><br>
    • GEX = Γ × (Call OI − Put OI) × S² × 1% × 100 = Γ × (${f0(oic)} − ${f0(oip)}) × ${f2(S)}² × 0.01 × 100 = <code>${sgn(gex)} triệu $</code>`;
}
